name: Validate add-on build

on:
  push:
    branches:
      - unificacao-com-autorizacao
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on images
        uses: docker/build-push-action@v6
        with:
          context: ./codex-terminal
          file: ./codex-terminal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: codex-terminal:test
