name: Codex Terminal
version: "0.2.1"
slug: codex_terminal
description: Codex para diagnóstico e manutenção autorizada do Home Assistant
url: https://github.com/sergiolpta/ha-codex-terminal
stage: experimental
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
stdin: true
ingress: true
ingress_port: 9123
panel_icon: mdi:robot
map:
  - type: homeassistant_config
    read_only: false
    path: /config
ports: {}
ports_description: {}
host_network: false
host_pid: false
host_ipc: false
host_dbus: false
privileged: []
full_access: false
apparmor: true
docker_api: false
hassio_api: false
homeassistant_api: false
auth_api: false
options:
  codex_model: default
  model_reasoning_effort: medium
  reasoning_summary: concise
  codex_sandbox: read-only
  maintenance_authorized: false
  task_root: /data/codex_tasks
  task_timeout_seconds: 3600
  auto_save_lovelace: false
  config_check: false
schema:
  codex_model: list(default|gpt-6-astra|gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna|gpt-5.5)
  model_reasoning_effort: list(minimal|low|medium|high|xhigh)
  reasoning_summary: list(concise|detailed|none)
  codex_sandbox: list(read-only|workspace-write)
  maintenance_authorized: bool
  task_root: str
  task_timeout_seconds: int
  auto_save_lovelace: bool
  config_check: bool
