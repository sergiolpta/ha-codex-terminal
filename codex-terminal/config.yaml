name: Codex Terminal
version: "0.1.0"
slug: codex_terminal
description: Private diagnostic terminal for Home Assistant with Codex CLI
url: https://github.com/sergiolpta/ha-codex-terminal
stage: experimental
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:console
map:
  - type: homeassistant_config
    read_only: true
    path: /config
ports: {}
ports_description: {}
host_network: false
host_pid: false
host_ipc: false
host_dbus: false
privileged: []
full_access: false
apparmor: true
docker_api: false
hassio_api: false
homeassistant_api: false
auth_api: false
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
